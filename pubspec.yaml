name: glucocontrol
description: "血糖控制应用 - 跨平台健康管理系统"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # 本地数据库
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  
  # 图表
  fl_chart: ^0.71.0
  
  # WebDAV
  webdav_client: ^3.0.0
  
  # BLE 心率
  flutter_blue_plus: ^1.35.3
  
  # HTTP
  dio: ^5.8.0
  
  # 图片
  image_picker: ^1.1.2
  
  # 路径
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # 权限
  permission_handler: ^11.4.0
  
  # 通知
  flutter_local_notifications: ^18.0.1
  
  # 路由
  go_router: ^12.1.11
  
  # 代码生成
  freezed_annotation: ^4.0.1
  
  # 工具
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
